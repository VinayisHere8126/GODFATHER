<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1c1c2c, #2e2b44);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: rgba(75, 75, 99, 0.95);
      border-radius: 15px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .form-control {
      border-radius: 10px;
      background: rgba(60,60,80,0.8);
      border: 1px solid #555;
      color: #fff;
      padding: 0.6rem 1rem;
      margin-bottom: 1rem;
    }
    .form-control:focus {
      border-color: #6c63ff;
      box-shadow: 0 0 8px rgba(108,99,255,0.4);
      background: rgba(60,60,80,1);
      color: #fff;
    }
    .btn-primary {
      background: linear-gradient(45deg, #6c63ff, #3f3d56);
      border: none;
      border-radius: 10px;
      font-weight: 600;
      width: 100%;
    }
    .btn-primary:hover {
      background: linear-gradient(45deg, #5752d3, #2f2d46);
    }
    .alert { border-radius: 10px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h3 class="text-center mb-3">Sign Up</h3>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST">
      <input type="text" name="username" class="form-control" placeholder="Username" required>
      <input type="password" name="password" class="form-control" placeholder="Password" required>
      <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>
    <p class="text-center mt-3">
      Already have an account? <a href="{{ url_for('login') }}" style="color:#6c63ff;">Log In</a>
    </p>
  </div>
</body>
</html>
