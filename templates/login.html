<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Disk Manager — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Background gradient with subtle contrast */
    body {
      height: 100vh;
      background: linear-gradient(135deg, #1c1c2c, #2e2b44);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Darker login card */
    .login-card {
      background: rgba(40, 40, 60, 0.95); /* dark translucent */
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .login-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.6);
    }

    .login-card h4 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #e0e0e0;
      letter-spacing: 0.5px;
    }

    /* Inputs */
    .form-control {
      border-radius: 10px;
      padding: 0.75rem 1rem;
      border: 1px solid #555;
      background: rgba(60, 60, 80, 0.8);
      color: #fff;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .form-control::placeholder {
      color: #aaa;
    }
    .form-control:focus {
      border-color: #6c63ff;
      box-shadow: 0 0 8px rgba(108, 99, 255, 0.4);
      background: rgba(60, 60, 80, 1);
      color: #fff;
    }

    /* Button */
    .btn-primary {
      width: 100%;
      padding: 0.75rem;
      border-radius: 10px;
      background: linear-gradient(45deg, #6c63ff, #3f3d56);
      border: none;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary:hover {
      background: linear-gradient(45deg, #5752d3, #2f2d46);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    }

    /* Flash messages */
    .alert {
      border-radius: 10px;
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h4>Disk Manager Login</h4>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{cat}}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post">
      <div class="mb-3">
        <label class="form-label text-light">Username</label>
        <input class="form-control" name="username" placeholder="Enter username" required>
      </div>
      <div class="mb-3">
        <label class="form-label text-light">Password</label>
        <input type="password" class="form-control" name="password" placeholder="Enter password" required>
      </div>

      <div class="text-center">
        <button class="btn btn-primary">Login</button>
      </div>
      <div class="text-center mt-3">
        <a class="btn btn-outline-light" href="{{ url_for('google.login') }}">
            <img src="https://img.icons8.com/color/16/google-logo.png"/> Login with Google
        </a>
      </div>

        <p class="text-center mt-3" style="color:#e0e0e0;">
                Don't have an account? 
            <a href="{{ url_for('signup') }}" style="color:#6c63ff; text-decoration:none; font-weight:600;">
                Sign Up
            </a>
        </p>

    </form>
  </div>
</body>
</html>
